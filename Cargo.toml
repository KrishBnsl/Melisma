[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
dhunn-core = { path = "crates/dhunn-core" }
dhunn-audio = { path = "crates/dhunn-audio" }
dhunn-dsp = { path = "crates/dhunn-dsp" }
dhunn-store = { path = "crates/dhunn-store" }
dhunn-meta = { path = "crates/dhunn-meta" }
dhunn-analysis = { path = "crates/dhunn-analysis" }
dhunn-import = { path = "crates/dhunn-import" }
dhunn-eval = { path = "crates/dhunn-eval" }
dhunn-index = { path = "crates/dhunn-index" }
dhunn-steer = { path = "crates/dhunn-steer" }
dhunn-profile = { path = "crates/dhunn-profile" }

anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
csv = "1.4"
dirs = "7"
hound = "3.5"
lofty = "0.25"
rayon = "1"
realfft = "3"
rodio = { version = "0.23", default-features = false, features = ["playback", "symphonia-all"] }
rubato = "0.16"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11"
symphonia = { version = "0.5.5", features = ["all"] }
tempfile = "3"
thiserror = "2"
walkdir = "2.5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[profile.release]
debug = 1

# DSP is unusably slow unoptimized; keep tests and dev runs fast.
[profile.dev.package."*"]
opt-level = 3
[profile.dev]
opt-level = 1
