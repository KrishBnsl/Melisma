[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
dhunn-core = { path = "crates/dhunn-core" }
dhunn-audio = { path = "crates/dhunn-audio" }
dhunn-dsp = { path = "crates/dhunn-dsp" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
realfft = "3"
rubato = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5.5", features = ["all"] }
thiserror = "2"

[profile.release]
debug = 1

# DSP is unusably slow unoptimized; keep tests and dev runs fast.
[profile.dev.package."*"]
opt-level = 3
[profile.dev]
opt-level = 1
